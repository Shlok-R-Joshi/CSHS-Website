<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>September 2026 CSHS Meeting</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.slide[hidden]{display:none}.slide img{display:block;width:100%;height:calc(100vh - 46px);object-fit:contain}nav{height:46px;display:flex;align-items:center;gap:12px;padding:6px 14px;background:#f3f6fc;color:#162844}button,select{font:inherit;border:0;border-radius:5px;padding:5px 10px;background:white;color:#162844;cursor:pointer}button:disabled{opacity:.35;cursor:default}a{margin-left:auto;color:#162844;font-size:13px}button:focus-visible,select:focus-visible{outline:2px solid #2674dc}
</style></head><body><section class="slide"><img src="slide-01.png" alt="September 2026 meeting — slide 1" width="1600" height="900"></section><section class="slide" hidden><img src="slide-02.png" alt="September 2026 meeting — slide 2" width="1600" height="900"></section><section class="slide" hidden><img src="slide-03.png" alt="September 2026 meeting — slide 3" width="1600" height="900"></section><section class="slide" hidden><img src="slide-04.png" alt="September 2026 meeting — slide 4" width="1600" height="900"></section><section class="slide" hidden><img src="slide-05.png" alt="September 2026 meeting — slide 5" width="1600" height="900"></section><section class="slide" hidden><img src="slide-06.png" alt="September 2026 meeting — slide 6" width="1600" height="900"></section><section class="slide" hidden><img src="slide-07.png" alt="September 2026 meeting — slide 7" width="1600" height="900"></section><nav aria-label="Slide controls"><button id="back" aria-label="Previous slide">‹</button><select id="slide" aria-label="Choose slide"><option value="0">1 / 7</option><option value="1">2 / 7</option><option value="2">3 / 7</option><option value="3">4 / 7</option><option value="4">5 / 7</option><option value="5">6 / 7</option><option value="6">7 / 7</option></select><button id="forward" aria-label="Next slide">›</button><a href="2026-CSHS-September-Meeting.pptx" download>Download PowerPoint</a></nav><script>
const slides=[...document.querySelectorAll('.slide')],pick=document.getElementById('slide');let current=0;
function show(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.hidden=i!==current);pick.value=current;document.getElementById('back').disabled=current===0;document.getElementById('forward').disabled=current===slides.length-1;}
document.getElementById('back').onclick=()=>show(current-1);document.getElementById('forward').onclick=()=>show(current+1);pick.onchange=()=>show(Number(pick.value));document.addEventListener('keydown',e=>{if(e.target===pick)return;if(e.key==='ArrowRight'){e.preventDefault();show(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1);}});show(0);
</script></body></html>
